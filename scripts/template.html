<script>
const D = __DATA__;
const PAL = ['#f97316','#38bdf8','#4ade80','#f472b6','#a78bfa','#facc15','#2dd4bf','#fb7185','#94a3b8','#818cf8','#a3e635','#fb923c'];
const col = o => PAL[D.owners.indexOf(o) % PAL.length];
const f0 = n => Math.round(n).toLocaleString();
const f1 = n => (Math.round(n * 10) / 10).toLocaleString(undefined, {minimumFractionDigits: 1});
const pct = (w, l, t) => { const g = w + l + t; return g ? ((w + t / 2) / g * 100).toFixed(1) + '%' : '-'; };
const rec = (w, l, t) => w + '-' + l + (t ? '-' + t : '');
const ph = g => (g.ph === 'playoff' ? 'Playoffs' : 'Wk ' + g.p);
const slug = o => o.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const logo = o => `<img class="logo" src="logos/${slug(o)}.webp" alt="" onerror="this.style.display='none'">`;
const ownerCell = o => `${logo(o)}<span class="name">${o}</span>`;
const ownerLink = o => `<a href="#owner/${encodeURIComponent(o)}" style="color:inherit;text-decoration:none">${ownerCell(o)}</a>`;

/* sortable table helper */
function drawT(id) {
  const t = window['_t_' + id], el = document.getElementById(id);
  let rows = t.rows.slice();
  if (t.sort !== null) { const c = t.cols[t.sort]; rows.sort((a, b) => { const x = c.v(a), y = c.v(b); return (x < y ? -1 : x > y ? 1 : 0) * t.dir; }); }
  el.innerHTML = '<thead><tr>' + t.cols.map((c, i) => `<th class="${c.num ? 'num' : ''} ${t.sort === i ? 'sorted' : ''}" onclick="sortT('${id}',${i})">${c.h}${t.sort === i ? (t.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => { const oc = t.onrow && t.onrow(r), rc = (t.rowcls && t.rowcls(r)) || '', cl = ((oc ? 'clk ' : '') + rc).trim(); return `<tr${cl ? ` class="${cl}"` : ''}${oc ? ` onclick="${oc}"` : ''}>` + t.cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.k(r)}</td>`).join('') + '</tr>'; }).join('') + '</tbody>';
}
function sortT(id, i) { const t = window['_t_' + id]; if (t.sort === i) t.dir *= -1; else { t.sort = i; t.dir = t.cols[i].num ? -1 : 1; } drawT(id); }
let tid = 0;
function T(cols, rows, onrow, rowcls) { const id = 'tb' + (tid++); window['_t_' + id] = {cols, rows, sort: null, dir: -1, onrow, rowcls}; setTimeout(() => drawT(id), 0); return `<table id="${id}"></table>`; }

/* ---------- matchup breakdown modal ---------- */
const dbar = (v, mx) => `<div class="dbar"><i style="width:${Math.max(0, v / mx * 100)}%"></i><b>${f1(v)}</b></div>`;
const pxs = v => v == null ? '' : `<span class="px">${f0(v)}</span>`;
const mqs = (s, ph, p, a, h) => `openMatch('${s}','${ph}',${p},'${a.replace(/'/g, "\\'")}','${h.replace(/'/g, "\\'")}')`;
function openMatch(s, phs, p, a, h) {
  const g = D.games.find(g => g.s === s && g.ph === phs && g.p === p && ((g.a === a && g.h === h) || (g.a === h && g.h === a)));
  if (!g) return;
  const PJ = D.pj[g.s + '|' + g.wk] || {};
  const MXALL = Math.max(1, ...D.pw.filter(x => x[0] === g.s && x[1] === g.wk && (x[2] === g.a || x[2] === g.h)).map(x => x[4]));
  const BN = (D.bn || {})[g.s + '|' + g.wk] || {};
  const brow = x => `<div class="mrow bn"><span class="mn">${face(x[0])}${pname(x[0])} <span class="mute">${ppos(x[0])}</span></span><span class="pts${x[1] ? '' : ' z'}">${f1(x[1])}</span></div>`;
  const side = (o, pts, win, px) => {
    const ps = D.pw.filter(x => x[0] === g.s && x[1] === g.wk && x[2] === o).sort((x, y) => y[4] - x[4]);
    const mx = MXALL;  // one scale for both teams
    const row = x => `<div class="mrow"><div class="bar" style="width:${Math.max(0, x[4] / mx * 100)}%"></div><span class="mn">${face(x[3])}${pname(x[3])}${x[3] === (ps[0] || [])[3] ? ' ⭐' : ''} <span class="mute">${ppos(x[3])}</span></span><span class="pts">${f1(x[4])}${PJ[x[3]] != null ? `<span class="px">${f0(PJ[x[3]])}</span>` : ''}</span></div>`;
    const grp = {G: [], F: [], C: []}, flex = [];
    const slot = {PG: 'G', SG: 'G', G: 'G', SF: 'F', PF: 'F', F: 'F', C: 'C'}, cap = {G: 3, F: 3, C: 2};
    ps.forEach(x => { const k = slot[ppos(x[3])]; (k && grp[k].length < cap[k] ? grp[k] : flex).push(x); });
    return {o, pts, win, px, ps, mx, bench: (BN[o] || []).map(brow), g: {Guards: grp.G.map(row), Forwards: grp.F.map(row), Centers: grp.C.map(row), 'Flex (G/F)': flex.map(row)}};
  };
  const live = !!g.live;  // week still in progress
  const gi = live ? FG.length : FG.indexOf(g), hist = FG.filter((x, i) => i <= gi && ((x.a === g.a && x.h === g.h) || (x.a === g.h && x.h === g.a)));
  const wA = hist.filter(x => (x.a === g.a ? x.ap > x.hp : x.hp > x.ap)).length, wH = hist.filter(x => (x.a === g.h ? x.ap > x.hp : x.hp > x.ap)).length, tt = hist.length - wA - wH;
  const series = hist.length < (live ? 1 : 2) ? 'First meeting' : wA === wH ? `Series tied ${wA}-${wH}${tt ? '-' + tt : ''}` : `${wA > wH ? g.a : g.h} leads the series ${Math.max(wA, wH)}-${Math.min(wA, wH)}${tt ? '-' + tt : ''}`;
  const A = side(g.a, g.ap, g.ap > g.hp, g.apx), H = side(g.h, g.hp, g.hp > g.ap, g.hpx);

  const hd = (X, right) => { const big = `<img class="mlogo" src="logos/${slug(X.o)}.webp" alt="" onerror="this.style.display='none'">`, txt = `<div class="mtxt"><div class="nm">${X.o}</div><div class="tot ${X.win ? 'w' : 'l'}">${f1(X.pts)}</div>${pxs(X.px)}</div>`; return `<div class="mside${right ? ' r' : ''}">${right ? txt + big : big + txt}</div>`; };
  document.getElementById('mb').innerHTML = `<button class="mx" onclick="closeMatch()">×</button>
    <div class="mhead">${hd(A, 0)}<div class="vs">vs</div>${hd(H, 1)}</div>
    <div class="msub">${g.s} · ${wkLabel(g.s, g.wk)} ${live ? '' : ' · ' + (g.ap === g.hp ? 'Tie' : `${g.ap > g.hp ? g.a : g.h} won by ${f1(Math.abs(g.ap - g.hp))}`)}${mv ? ` · Top scorer: ${pname(mv[3])} (${f1(mv[4])})` : ''} · counted lineup only</div>

    <div class="mcols">${A.ps.length || H.ps.length ? ['Guards', 'Forwards', 'Centers', 'Flex (G/F)'].map(t => {
      const n = Math.max(A.g[t].length, H.g[t].length); if (!n) return '';
      return `<div class="msec">${t}</div>` + Array.from({length: n}, (_, i) => `<div class="mcell">${A.g[t][i] || ''}</div><div class="mcell">${H.g[t][i] || ''}</div>`).join('');
    }).join('') + (Math.max(A.bench.length, H.bench.length) ? `<div class="msec">Bench</div>` + Array.from({length: Math.max(A.bench.length, H.bench.length)}, (_, i) => `<div class="mcell">${A.bench[i] || ''}</div><div class="mcell">${H.bench[i] || ''}</div>`).join('') : '') : '<div class="mute" style="grid-column:1/-1">No player-level data for this week.</div>'}</div>`;
  document.getElementById('mm').classList.add('on');
}

/* ---------- Draft board ---------- */
window._dm = window._dm || 'ppg';
const DB_MODES = [['ppg', 'Points per game'], ['tot', 'Total points'], ['slot', 'vs. pick slot (PPG)']];
function dbExpected(se, mode) {  // average result of the picks around this slot in finished seasons (missing stats count 0)
  const seas = Object.entries(D.draft).filter(([k, d]) => d.done && d.maxg);
  const val = p => mode === 'tot' ? (p[5] || 0) : (p[6] || 0);
  const cur = D.draft[se], scale = mode === 'tot' ? (cur.maxg || 82) / (seas.reduce((a, [, d]) => a + d.maxg, 0) / seas.length) : 1;
  return pick => {
    const xs = []; for (const [, d] of seas) for (const p of d.picks) if (Math.abs(p[1] - pick) <= 6) xs.push(val(p));
    return xs.length ? scale * xs.reduce((a, b) => a + b, 0) / xs.length : 0;
  };
}
function dbColor(t) {  // t in [-1, 1]: blue (under) to white to orange (over)
  const a = Math.min(1, Math.abs(t)), mix = (c, w) => Math.round(w + (c - w) * a);
  return t >= 0 ? `rgb(${mix(234, 255)},${mix(138, 255)},${mix(40, 255)})` : `rgb(${mix(90, 255)},${mix(130, 255)},${mix(200, 255)})`;
}
function shortName(n) {  // "Giannis Antetokounmpo" -> "G. Antetokounmpo" when too long for a square
  if (n.length <= 14) return n;
  const w = n.split(' '), suf = /^(Jr\.?|Sr\.?|II|III|IV)$/.test(w[w.length - 1]) ? ' ' + w.pop() : '';
  return w.length > 1 ? w[0][0] + '. ' + w.slice(1).join(' ') + suf : n;
}
function drawDraft(se) {
  const d = D.draft[se], el = document.getElementById('dboard');
  if (!el) return;
  const mode = window._dm, has = d.maxg != null;
  document.getElementById('dbctl').innerHTML = DB_MODES.map(([k, l]) => `<button class="share" style="${k === mode ? 'background:#f97316;color:#0f1117;border-color:#f97316;' : ''}margin-left:0;margin-right:6px" onclick="window._dm='${k}';drawDraft('${se}')">${l}</button>`).join('') +
    `<span class="mute" style="font-size:11px">${has ? 'Full-season NBA stats for each drafted player' + (d.done ? '' : ' (season in progress)') + (mode === 'slot' ? ' · orange = beat what that slot usually returns here, blue = fell short' : '') : 'No player stats stored for this season'}</span>`;
  const exp = has && mode === 'slot' ? dbExpected(se, 'ppg') : null;
  const raw = p => p[4] == null ? null : mode === 'tot' ? p[5] : p[6];
  const score = p => { const v = raw(p); return v == null || !p[4] ? null : exp ? v - exp(p[1]) : v; };
  const sc = d.picks.map(score).filter(v => v != null).sort((a, b) => a - b);
  const q = x => sc.length ? sc[Math.min(sc.length - 1, Math.floor(x * sc.length))] : 0;
  const lo = q(0.05), hi = q(0.95), mid = q(0.5);
  const tone = v => exp ? dbColor(v >= 0 ? v / Math.max(hi, 1e-9) : v / Math.max(-lo, 1e-9))
                        : dbColor(v >= mid ? (v - mid) / Math.max(hi - mid, 1e-9) : (v - mid) / Math.max(mid - lo, 1e-9));
  const teams = d.order, nR = Math.max(...d.picks.map(p => p[0]));
  const by = {}; d.picks.forEach(p => by[p[0] + '|' + p[2]] = p);
  let h = `<div style="overflow-x:auto"><table style="border-collapse:separate;border-spacing:3px;table-layout:fixed;width:${teams.length * 106 + 40}px"><tr><th style="width:34px"></th>${teams.map(o => `<th style="width:100px;text-align:center;font-size:11px;vertical-align:bottom;overflow:hidden;white-space:nowrap;text-overflow:ellipsis"><a href="#owner/${encodeURIComponent(o)}" style="color:inherit;text-decoration:none">${esc(o)}</a><div class="mute" style="font-weight:400;font-size:9px;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis">${esc(d.teams[o] || '')}</div></th>`).join('')}</tr>`;
  for (let r = 1; r <= nR; r++) {
    h += `<tr><td class="mute" style="font-size:11px;text-align:center;padding-right:4px">${r}<br>${r % 2 ? '→' : '←'}</td>`;
    for (const o of teams) {
      const p = by[r + '|' + o];
      if (!p) { h += '<td></td>'; continue; }
      const v = score(p), bg = v == null ? '#1a2030' : tone(v), dark = v != null;
      const label = p[4] == null ? '' : !p[4] ? 'DNP' : exp ? (v >= 0 ? '+' : '−') + f1(Math.abs(v)) : mode === 'tot' ? f0(p[5]) : f1(p[6]);
      h += `<td style="background:${bg};${dark ? 'color:#0f1117;' : ''}border-radius:6px;padding:4px 3px;text-align:center;vertical-align:top;font-size:11px;line-height:1.2;width:100px;height:74px;overflow:hidden" title="${esc(pname(p[3]))}: ${p[4] ? p[4] + ' GP, ' + f0(p[5]) + ' pts, ' + f1(p[6]) + ' per game' : 'no games'}">
        <div style="display:flex;justify-content:space-between;font-size:9px;opacity:.75"><span>${r}.${String(p[1] - (r - 1) * teams.length).padStart(2, '0')} #${p[1]}</span><span>${esc(ppos(p[3]))}</span></div>
        <div style="height:28px">${face(p[3])}</div><a class="pl" href="#whohas/${p[3]}" style="display:block;max-width:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;${dark ? 'color:#0f1117' : ''}">${esc(shortName(pname(p[3])))}</a><div style="font-weight:700">${label}</div></td>`;
    }
    h += '</tr>';
  }
  el.innerHTML = h + '</table></div>';
}

  ${beat ? `<div class="section"><div class="section-title">Better than Wemby</div><div class="mute" style="font-size:12px;margin:-6px 0 10px">${beat.length} player${beat.length === 1 ? '' : 's'} scored more on ${fmtD(nightD)} than Victor Wembanyama's last game (${f1(wLast[4])} FPts, ${fmtD(wLast[2])}). Showing the ${Math.min(5, beat.length)} drafted latest.</div>` + (beat.length ? T([
    {h: 'Player', k: x => plink(x.pid) + ` <span class="mute">${ppos(x.pid)}</span>`, v: x => pname(x.pid)},
    {h: 'FPts', k: x => f1(x.pts), v: x => x.pts, num: 1},
    {h: 'vs Wemby', k: x => `<span class="up">+${f1(x.pts - wLast[4])}</span>`, v: x => x.pts - wLast[4], num: 1},
    {h: 'Drafted', k: x => x.dr ? `Rd ${x.dr.rd}, pick ${x.dr.pk}${x.dr.rd >= 11 ? ' <span class="late" title="Drafted in round 11 or later">late pick</span>' : ''} <span class="mute">${x.dr.o}</span>` : '<span class="late">undrafted</span>', v: x => x.dr ? x.dr.pk : 1e9, num: 1},
  ], beat.slice(0, 5)) : '<div class="mute" style="padding:14px 4px">Nobody beat him yet.</div>') + `</div>` : ''}
  <div class="section"><div class="section-title">Best player on each team</div>` +
  T([
    {h: 'Owner', k: x => ownerLink(x[2]), v: x => x[2]},
    {h: 'Player', k: x => plink(x[3]), v: x => pname(x[3])},
    {h: 'FPts', k: x => dbar(x[4], wkMax), v: x => x[4], num: 1},
  ], Object.values(best).sort((a, b) => b[4] - a[4])) + `</div>
  <div class="section"><div class="section-title">Season leaders through ${wkLabel(season, wk)} (counted weeks only)</div>` +
  T([
    {h: 'Player', k: x => plink(x.pid), v: x => pname(x.pid)},
    {h: 'Owner', k: x => ownerLink(x.o), v: x => x.o},
    ...(hasGp ? [{h: 'FPts/G', k: x => f1(ppg(x)), v: x => ppg(x), num: 1}, {h: 'Games', k: x => x.gp, v: x => x.gp, num: 1}] : []),
    {h: 'FPts', k: x => f0(x.pts), v: x => x.pts, num: 1},
    {h: 'Wks counted', k: x => x.wks, v: x => x.wks, num: 1},
  ], leaders) + `<div class="note">Ranked by FPts per game to adjust for schedule differences. Weeks a player sat on the bench or was on someone else's team are not counted, so these are not full-season totals.</div></div>
  </div>
  <div class="section"><div class="section-title">Power rankings${done ? ' after ' + wkLabel(season, done) : ''}</div>` +
  (pwr.length ? `<div class="mute" style="font-size:12px;margin:-6px 0 10px">Average of each team's rank in last-3-week scoring and season all-play win %</div>` + T([
    {h: '#', k: r => r.rk, v: r => r.rk, num: 1},
    {h: 'Owner', k: r => ownerLink(r.o), v: r => r.o},
    {h: '+/-', k: r => r.mv > 0 ? `<span class="up">▲${r.mv}</span>` : r.mv < 0 ? `<span class="down">▼${-r.mv}</span>` : '<span class="mute">-</span>', v: r => r.mv, num: 1},
    {h: 'Last 3 avg', k: r => f1(r.l3), v: r => r.l3, num: 1},
    {h: 'Season avg', k: r => f1(r.sa), v: r => r.sa, num: 1},
    {h: 'All-play %', k: r => (r.ap * 100).toFixed(0) + '%', v: r => r.ap, num: 1},
  ], pwr) + `<div class="section-title" style="margin-top:22px">All-play win % by week (cumulative)</div><div class="chart-box tall" style="height:340px"><canvas id="c_trend"></canvas></div>` : `<div class="mute" style="padding:14px 4px">Power rankings start once a week is final.</div>`) + `</div>
  <div class="section"><div class="section-title">Luck: actual vs all-play win % (regular season through ${done ? wkLabel(season, done) : 'none yet'})</div>
  <div class="mute" style="font-size:12px;margin:-6px 0 10px">Expected record of each team if they played all opponents every week</div><div class="chart-box tall" style="height:520px"><canvas id="c_luck"></canvas></div>` +
  T([
    {h: 'Owner', k: r => ownerLink(r.o), v: r => r.o},
    {h: 'Actual', k: r => rec(r.w, r.g - r.w, 0).replace(/-0$/, '') + ' (' + (r.wp * 100).toFixed(0) + '%)', v: r => r.wp, num: 1},
    {h: 'All-play', k: r => f0(r.aw) + '-' + f0(r.ag - r.aw) + ' (' + (r.ap * 100).toFixed(0) + '%)', v: r => r.ap, num: 1},
    {h: 'Luck (wins)', k: r => `<span class="${r.d > 0.005 ? 'pos' : r.d < -0.005 ? 'neg' : 'mute'}">${r.w - r.ew > 0 ? '+' : ''}${(r.w - r.ew).toFixed(1)}</span>`, v: r => r.w - r.ew, num: 1},
    {h: 'Seed: actual → all-play', k: r => r.sa == null ? '-' : `${r.sa} → <span class="${N && r.sp <= N && r.sa > N ? 'pos' : N && r.sp > N && r.sa <= N ? 'neg' : ''}">${r.sp}</span>`, v: r => r.sp - (r.sa || r.sp), num: 1},
  ], luck) + `<div class="note">All-play = each team's record if it had played every other team each week (${D.owners.length - 1} games a week instead of 1). Luck = actual wins minus all-play expected wins (positive = lucky). Seed column re-ranks teams by all-play wins: green = would get in, red = would miss. Playoffs excluded.</div></div>`;
}
function copyBlurb(btn) {
  const el = document.getElementById('blurb'), txt = el.innerText, done = ok => { btn.textContent = ok ? 'Copied!' : 'Select and copy'; setTimeout(() => btn.textContent = 'Copy for group chat', 2500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false));
  else { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} done(ok); }
}
document.addEventListener('keydown', e => {
  if (!window._rs || document.getElementById('mm').classList.contains('on') || /^(SELECT|INPUT|TEXTAREA)$/.test((document.activeElement || {}).tagName || '')) return;
  if ((location.hash.slice(1) || 'recap').split('/')[0] !== 'recap' || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  const i = window._rwks.indexOf(window._rs[1]) + (e.key === 'ArrowRight' ? 1 : -1);
  if (window._rwks[i] != null) location.hash = 'recap/' + window._rs[0] + '/' + window._rwks[i];
});
function afterRecap() {
  const tr = window._trend, te = document.getElementById('c_trend');
  if (te && tr && tr.wks.length) chart(te, {type: 'line', data: {labels: tr.wks.map(w => 'Wk ' + w), datasets: tr.series.map(s => ({label: s.o, data: s.data, borderColor: col(s.o), backgroundColor: col(s.o), borderWidth: 2, pointRadius: tr.wks.length > 12 ? 0 : 3, pointHoverRadius: 5, tension: .25}))},
    options: {maintainAspectRatio: false, interaction: {mode: 'nearest', intersect: false}, scales: {y: {ticks: {callback: v => v + '%'}}}, plugins: {legend: {position: 'bottom', labels: {boxWidth: 10, font: {size: 11}}}, tooltip: {callbacks: {label: i => `${i.dataset.label}: ${i.parsed.y}%`}}}}});
  const L = window._luck || [], el = document.getElementById('c_luck');
  if (!el || !L.length) return;
  const lo = Math.floor(Math.min(...L.map(r => Math.min(r.ap, r.wp))) * 10) * 10 - 5, hi = Math.ceil(Math.max(...L.map(r => Math.max(r.ap, r.wp))) * 10) * 10 + 5;
  const mn = Math.max(0, lo), mx = Math.min(100, hi);
  const diag = {id: 'diag', afterDatasetsDraw(c) {
    const {ctx, scales: {x, y}} = c;
    ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x.getPixelForValue(mn), y.getPixelForValue(mn)); ctx.lineTo(x.getPixelForValue(mx), y.getPixelForValue(mx)); ctx.stroke();
    ctx.setLineDash([]); ctx.font = '600 11px sans-serif';
    ctx.fillStyle = '#4ade80aa'; ctx.textAlign = 'left'; ctx.fillText('LUCKY (above the line)', x.left + 8, y.top + 14);
    ctx.fillStyle = '#f87171aa'; ctx.textAlign = 'right'; ctx.fillText('UNLUCKY (below the line)', x.right - 8, y.bottom - 8);
    ctx.fillStyle = '#e2e8f0'; ctx.textAlign = 'left'; ctx.font = '600 11px sans-serif';
    // nudge labels apart so clustered teams stay readable
    const pts = c.getDatasetMeta(0).data.map((pt, i) => ({i, x: pt.x + 10, y: pt.y + 4})).sort((a, b) => a.y - b.y);
    pts.forEach((p, k) => { for (let j = k - 1; j >= 0; j--) { if (p.y - pts[j].y >= 13) break; if (Math.abs(p.x - pts[j].x) < 70) { p.y = pts[j].y + 13; break; } } });
    pts.forEach(p => ctx.fillText(L[p.i].o, p.x, p.y));
    ctx.restore();
  }};
  chart(el, {type: 'scatter', plugins: [diag], data: {datasets: [{
    data: L.map(r => ({x: +(r.ap * 100).toFixed(1), y: +(r.wp * 100).toFixed(1)})),
    backgroundColor: L.map(r => col(r.o)), pointRadius: 8, pointHoverRadius: 10}]},
    options: {maintainAspectRatio: false, layout: {padding: {right: window.innerWidth < 600 ? 45 : 70}},
      scales: {x: {min: mn, max: mx, title: {display: true, text: 'All-play win % (record vs every team each week)'}, ticks: {callback: v => v + '%'}},
               y: {min: mn, max: mx, title: {display: true, text: 'Actual win %'}, ticks: {callback: v => v + '%'}}},
      plugins: {legend: {display: false}, tooltip: {callbacks: {
        title: i => L[i[0].dataIndex].o,
        label: i => { const r = L[i.dataIndex]; return [`Actual: ${(r.wp * 100).toFixed(0)}%`, `All-play: ${(r.ap * 100).toFixed(0)}%`, `Luck: ${r.d > 0 ? '+' : ''}${(r.d * 100).toFixed(0)} pts`]; }}}}}});
}

/* ---------- Who Has Him ---------- */
function stintLabel(se, a, b) { return !D.seasons.includes(se) ? 'current roster' : a === 1 && b >= 23 ? 'full season' : `wk ${a}-${b}`; }
function viewWho(pid) {
  const list = Object.keys(D.players).sort((a, b) => pname(a).localeCompare(pname(b)));
  const box = `<div class="controls"><input class="search" list="plist" placeholder="Search a player..." value="${pid && D.players[pid] ? pname(pid) : ''}" onchange="whoGo(this.value)"><datalist id="plist">${list.map(k => `<option value="${pname(k)}">`).join('')}</datalist>${pid && D.players[pid] ? `<button class="share" onclick="shareLink(this,'${pid}')">Copy share link</button>` : ''}</div>`;
  if (!pid || !D.players[pid]) {
    const rows = Object.keys(D.stints).map(k => ({pid: k, owners: [...new Set(D.stints[k].map(x => x[1]))], n: D.stints[k].length}));
    const most = rows.sort((a, b) => b.owners.length - a.owners.length || b.n - a.n).slice(0, 15);
    return `<h1>Who Has Him</h1><div class="subtitle">Draft and ownership history for every player rostered since ${D.seasonsAll[0]}</div>${box}
    <div class="section"><div class="section-title">Most-traveled players (distinct owners)</div>` + T([
      {h: 'Player', k: r => plink(r.pid) + ` <span class="mute">${ppos(r.pid)}</span>`, v: r => pname(r.pid)},
      {h: 'Owners', k: r => r.owners.length, v: r => r.owners.length, num: 1},
      {h: 'Who', k: r => r.owners.join(', '), v: r => r.owners.join()},
    ], most) + '</div>';
  }
  const st = D.stints[pid] || [], pk = D.picks[pid] || [];
  const bySeason = {}; st.forEach(x => (bySeason[x[0]] = bySeason[x[0]] || []).push(x));
  const cnt = {}; Object.values(bySeason).forEach(v => [...new Set(v.map(x => x[1]))].forEach(o => cnt[o] = (cnt[o] || 0) + 1));
  const nowS = D.seasonsAll[D.seasonsAll.length - 1], now = (bySeason[nowS] || []).slice(-1)[0];
  const S = D.stats[pid], sTag = (k, v, hl) => `<div class="stat ${hl ? 'hl' : ''}"><div class="sv">${v}</div><div class="sk">${k}</div></div>`;
  const pickOf = (se, o) => (pk.find(x => x[0] === se && x[1] === o) || null);
  const cards = D.seasonsAll.map(se => {
    const v = bySeason[se];
    if (!v) return `<div class="tl empty"><div class="tls">${se}</div><div class="mute" style="font-size:12px;margin-top:14px">Not rostered</div></div>`;
    return `<div class="tl"><div class="tls">${se}</div>` + v.map(x => {
      const dp = pickOf(se, x[1]);
      return `<div class="tlo">${logo(x[1])}<div><div class="name">${x[1]}</div><div class="mute" style="font-size:11px">${stintLabel(se, x[2], x[3])}</div></div></div>` +
        (dp && x === v[0] ? `<div class="pick">Drafted R${dp[2]} · #${dp[3]}</div>` : '');
    }).join('') + '</div>';
  }).join('');
  return `<div class="hero">${face(pid, 2)}<div class="hinfo"><div class="hname">${pname(pid)}</div>
    <div class="hmeta">${[ppos(pid), S && S.tm && S.tm !== '(N/A)' ? S.tm : ''].filter(Boolean).join(' · ')}</div>
    <div class="hnow">${now ? 'Currently on ' + ownerCell(now[1]) + ' &nbsp;<span class="mute">(' + nowS + (D.seasons.includes(nowS) ? '' : ' roster') + ')</span>' : '<span class="mute">Not rostered in ' + nowS + '</span>'}</div>
    <div style="margin-top:14px">${box.replace('class="controls"', 'class="controls" style="margin:0"')}</div></div></div>
  ${S && S.g ? `<div class="section"><div class="section-title">${D.statsSeason} season · per game</div><div class="stats">
    ${sTag('FP rank', '#' + S.rk, 1)}${sTag('FPts', f0(S.fpts))}${sTag('FP/G', S.fpg.toFixed(1))}${sTag('Games', S.g)}
    ${sTag('PTS', S.pts.toFixed(1))}${sTag('REB', S.reb.toFixed(1))}${sTag('AST', S.ast.toFixed(1))}${sTag('STL', S.st.toFixed(1))}${sTag('BLK', S.blk.toFixed(1))}${sTag('TO', S.to.toFixed(1))}
  </div></div>` : `<div class="section"><div class="section-title">${D.statsSeason} season</div><div class="mute">No ${D.statsSeason} stats (did not play).</div></div>`}
  <div class="section"><div class="section-title">Ownership timeline</div><div class="timeline">${cards}</div></div>
  ${pk.length ? `<div class="section"><div class="section-title">Draft position by year</div><div class="chart-box" style="height:260px"><canvas id="c_draft"></canvas></div><div class="note">Overall pick number each year (higher on the chart = earlier pick). Logo = drafting owner.</div></div>` : ''}
  <div class="section"><div class="section-title">Owners all-time</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">
    <div class="card"><div class="v">${Object.keys(cnt).length}</div><div class="k">Different owners</div></div>
    <div class="card"><div class="v">${Object.keys(bySeason).length}</div><div class="k">Seasons rostered</div></div>
    <div class="card"><div class="v">${pk.length}</div><div class="k">Times drafted</div></div></div>` +
    Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([o, n]) => `<span class="stint">${ownerCell(o)}&nbsp;<span class="mute">${n} season${n > 1 ? 's' : ''}</span></span>`).join('') + `</div>`;
}
function afterWho(pid) {
  const el = document.getElementById('c_draft'); if (!el) return;
  const pk = D.picks[pid] || [], by = {}; pk.forEach(x => by[x[0]] = x);
  const pts = D.seasonsAll.map(se => by[se] ? by[se][3] : null);
  const maxPick = Math.max(...pts.filter(x => x), 10);
  const labels = {id: 'pickLabels', afterDatasetsDraw(c) {
    const m = c.getDatasetMeta(0), x = c.ctx; x.save(); x.fillStyle = '#e2e8f0'; x.font = '600 12px sans-serif'; x.textAlign = 'center';
    m.data.forEach((pt, i) => { if (pts[i]) x.fillText('#' + pts[i], pt.x, pt.y + 30); }); x.restore(); }};
  const imgs = D.seasonsAll.map(se => { if (!by[se]) return 'circle'; const im = new Image(30, 30); im.src = 'logos/' + slug(by[se][1]) + '.webp'; im.onload = () => c.update('none'); return im; });
  const c = chart(el, {type: 'line', plugins: [labels], data: {labels: D.seasonsAll, datasets: [{label: 'Draft pick', data: pts, spanGaps: false, borderColor: '#64748b', borderWidth: 2, tension: .15,
      pointStyle: imgs, pointRadius: 15, pointHoverRadius: 17, pointBackgroundColor: D.seasonsAll.map(se => by[se] ? col(by[se][1]) : '#64748b'), pointBorderColor: '#0f1117', pointBorderWidth: 2}]},
    options: {maintainAspectRatio: false, layout: {padding: {bottom: 18, top: 10, left: 10, right: 20}},
      scales: {y: {reverse: true, min: 1, suggestedMax: Math.ceil((maxPick + 12) / 10) * 10, title: {display: true, text: 'Overall pick'}, ticks: {precision: 0}}, x: {title: {display: true, text: 'Season'}}},
      plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => { const x = by[D.seasonsAll[c.dataIndex]]; return x ? `${x[1]}: round ${x[2]}, pick #${x[3]}` : ''; }}}}}});
}
function shareLink(btn, pid) {
  const url = 'https://fantrax.whohashim.com/p/' + pid + '/', done = ok => { btn.textContent = ok ? 'Link copied!' : url; setTimeout(() => btn.textContent = 'Copy share link', 2500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(() => done(true), () => done(false));
  else { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); done(ok); }
}
function whoGo(name) { const k = Object.keys(D.players).find(k => pname(k).toLowerCase() === name.toLowerCase()); if (k) location.hash = 'whohas/' + k; }

/* ---------- router ---------- */
function render() {
  const [tab, x, y] = (location.hash.slice(1) || 'recap').split('/');
  const t = TABS.find(v => v[0] === tab) ? tab : 'recap';
  charts.splice(0).forEach(c => c.destroy());
  tid = 0;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  const v = {alltime: () => viewAlltime(), seasons: () => viewSeasons(x), owner: () => viewOwner(x), records: () => viewRecords(), rivalry: () => viewRivalry(x, y), recap: () => viewRecap(x, y), whohas: () => viewWho(x)}[t]();
  document.getElementById('panels').innerHTML = `<div class="tab-panel active">${v}</div>`;
  document.querySelectorAll('#panels table').forEach(t => { const w = document.createElement('div'); w.className = 'tscroll'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  if (t === 'recap' && window._rs) { const u = '#recap/' + window._rs.join('/'); if (location.hash !== u) history.replaceState(null, '', u); }
  if (t === 'seasons') afterSeasons(x); if (t === 'whohas') afterWho(x); if (t === 'recap') afterRecap();
  window.scrollTo(0, 0);
}
document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab-btn" data-t="${k}" onclick="location.hash='${k}'">${l}</button>`).join('');
window.addEventListener('hashchange', render);
render();
</script>
<script src="/chat/chat.js" defer></script>
