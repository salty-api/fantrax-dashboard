  el.innerHTML = '<thead><tr>' + t.cols.map((c, i) => `<th class="${c.num ? 'num' : ''} ${t.sort === i ? 'sorted' : ''}" onclick="sortT('${id}',${i})">${c.h}${t.sort === i ? (t.dir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => { const oc = t.onrow && t.onrow(r), rc = (t.rowcls && t.rowcls(r)) || '', cl = ((oc ? 'clk ' : '') + rc).trim(); return `<tr${cl ? ` class="${cl}"` : ''}${oc ? ` onclick="${oc}"` : ''}>` + t.cols.map(c => `<td class="${c.num ? 'num' : ''}">${c.k(r)}</td>`).join('') + '</tr>'; }).join('') + '</tbody>';
}

function openMatch(s, phs, p, a, h) {
  const g = D.games.find(g => g.s === s && g.ph === phs && g.p === p && ((g.a === a && g.h === h) || (g.a === h && g.h === a)));
  if (!g) return;
  const PJ = D.pj[g.s + '|' + g.wk] || {};
  const MXALL = Math.max(1, ...D.pw.filter(x => x[0] === g.s && x[1] === g.wk && (x[2] === g.a || x[2] === g.h)).map(x => x[4]));
  const BN = (D.bn || {})[g.s + '|' + g.wk] || {};
  const brow = x => `<div class="mrow bn"><span class="mn">${face(x[0])}${pname(x[0])} <span class="mute">${ppos(x[0])}</span></span><span class="pts${x[1] ? '' : ' z'}">${f1(x[1])}</span></div>`;
  const side = (o, pts, win, px) => {
    const ps = D.pw.filter(x => x[0] === g.s && x[1] === g.wk && x[2] === o).sort((x, y) => y[4] - x[4]);
    const mx = MXALL;  // one scale for both teams
    const row = x => `<div class="mrow"><div class="bar" style="width:${Math.max(0, x[4] / mx * 100)}%"></div><span class="mn">${face(x[3])}${pname(x[3])}${x[3] === (ps[0] || [])[3] ? ' ⭐' : ''} <span class="mute">${ppos(x[3])}</span></span><span class="pts">${f1(x[4])}${PJ[x[3]] != null ? `<span class="px">${f0(PJ[x[3]])}</span>` : ''}</span></div>`;
    const grp = {G: [], F: [], C: []}, flex = [];
    const slot = {PG: 'G', SG: 'G', G: 'G', SF: 'F', PF: 'F', F: 'F', C: 'C'}, cap = {G: 3, F: 3, C: 2};
    ps.forEach(x => { const k = slot[ppos(x[3])]; (k && grp[k].length < cap[k] ? grp[k] : flex).push(x); });
    return {o, pts, win, px, ps, mx, bench: (BN[o] || []).map(brow), g: {Guards: grp.G.map(row), Forwards: grp.F.map(row), Centers: grp.C.map(row), 'Flex (G/F)': flex.map(row)}};
  };
  const live = !!g.live;  // week still in progress
  const gi = live ? FG.length : FG.indexOf(g), hist = FG.filter((x, i) => i <= gi && ((x.a === g.a && x.h === g.h) || (x.a === g.h && x.h === g.a)));
  const wA = hist.filter(x => (x.a === g.a ? x.ap > x.hp : x.hp > x.ap)).length, wH = hist.filter(x => (x.a === g.h ? x.ap > x.hp : x.hp > x.ap)).length, tt = hist.length - wA - wH;
  const series = hist.length < (live ? 1 : 2) ? 'First meeting' : wA === wH ? `Series tied ${wA}-${wH}${tt ? '-' + tt : ''}` : `${wA > wH ? g.a : g.h} leads the series ${Math.max(wA, wH)}-${Math.min(wA, wH)}${tt ? '-' + tt : ''}`;
  const A = side(g.a, g.ap, g.ap > g.hp, g.apx), H = side(g.h, g.hp, g.hp > g.ap, g.hpx);
  const mv = [...A.ps, ...H.ps].sort((x, y) => y[4] - x[4])[0];
  const hd = (X, right) => { const big = `<img class="mlogo" src="logos/${slug(X.o)}.webp" alt="" onerror="this.style.display='none'">`, txt = `<div class="mtxt"><div class="nm">${X.o}</div><div class="tot ${X.win ? 'w' : 'l'}">${f1(X.pts)}</div>${pxs(X.px)}</div>`; return `<div class="mside${right ? ' r' : ''}">${right ? txt + big : big + txt}</div>`; };
  document.getElementById('mb').innerHTML = `<button class="mx" onclick="closeMatch()">×</button>
    <div class="mhead">${hd(A, 0)}<div class="vs">vs</div>${hd(H, 1)}</div>
    <div class="msub">${g.s} · ${wkLabel(g.s, g.wk)} ${live ? '' : ' · ' + (g.ap === g.hp ? 'Tie' : `${g.ap > g.hp ? g.a : g.h} won by ${f1(Math.abs(g.ap - g.hp))}`)}${mv ? ` · Top scorer: ${pname(mv[3])} (${f1(mv[4])})` : ''} · counted lineup only</div>
    <div class="msub" style="margin-top:-8px">${series}</div>
    <div class="mcols">${A.ps.length || H.ps.length ? ['Guards', 'Forwards', 'Centers', 'Flex (G/F)'].map(t => {
      const n = Math.max(A.g[t].length, H.g[t].length); if (!n) return '';
      return `<div class="msec">${t}</div>` + Array.from({length: n}, (_, i) => `<div class="mcell">${A.g[t][i] || ''}</div><div class="mcell">${H.g[t][i] || ''}</div>`).join('');
    }).join('') + (Math.max(A.bench.length, H.bench.length) ? `<div class="msec">Bench</div>` + Array.from({length: Math.max(A.bench.length, H.bench.length)}, (_, i) => `<div class="mcell">${A.bench[i] || ''}</div><div class="mcell">${H.bench[i] || ''}</div>`).join('') : '') : '<div class="mute" style="grid-column:1/-1">No player-level data for this week.</div>'}</div>`;
  document.getElementById('mm').classList.add('on');
}

function finishGrid() {
  const by = {}; D.rows.forEach(r => by[r.s + '|' + r.o] = r);

    <div style="margin-top:14px">${box.replace('class="controls"', 'class="controls" style="margin:0"')}</div></div></div>
  ${S && S.g ? `<div class="section"><div class="section-title">${D.statsSeason} season · per game</div><div class="stats">
    ${sTag('FP rank', '#' + S.rk, 1)}${sTag('FPts', f0(S.fpts))}${sTag('FP/G', S.fpg.toFixed(1))}${sTag('Games', S.g)}
    ${sTag('PTS', S.pts.toFixed(1))}${sTag('REB', S.reb.toFixed(1))}${sTag('AST', S.ast.toFixed(1))}${sTag('STL', S.st.toFixed(1))}${sTag('BLK', S.blk.toFixed(1))}${sTag('TO', S.to.toFixed(1))}
  </div></div>` : `<div class="section"><div class="section-title">${D.statsSeason} season</div><div class="mute">No ${D.statsSeason} stats (did not play).</div></div>`}
  <div class="section"><div class="section-title">Ownership timeline</div><div class="timeline">${cards}</div></div>
  ${pk.length ? `<div class="section"><div class="section-title">Draft position by year</div><div class="chart-box" style="height:260px"><canvas id="c_draft"></canvas></div><div class="note">Overall pick number each year (higher on the chart = earlier pick). Logo = drafting owner.</div></div>` : ''}
  <div class="section"><div class="section-title">Owners all-time</div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">
    <div class="card"><div class="v">${Object.keys(cnt).length}</div><div class="k">Different owners</div></div>
    <div class="card"><div class="v">${Object.keys(bySeason).length}</div><div class="k">Seasons rostered</div></div>
    <div class="card"><div class="v">${pk.length}</div><div class="k">Times drafted</div></div></div>` +
    Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([o, n]) => `<span class="stint">${ownerCell(o)}&nbsp;<span class="mute">${n} season${n > 1 ? 's' : ''}</span></span>`).join('') + `</div>`;
}
function afterWho(pid) {
  const el = document.getElementById('c_draft'); if (!el) return;
  const pk = D.picks[pid] || [], by = {}; pk.forEach(x => by[x[0]] = x);
  const pts = D.seasonsAll.map(se => by[se] ? by[se][3] : null);
  const maxPick = Math.max(...pts.filter(x => x), 10);
  const labels = {id: 'pickLabels', afterDatasetsDraw(c) {
    const m = c.getDatasetMeta(0), x = c.ctx; x.save(); x.fillStyle = '#e2e8f0'; x.font = '600 12px sans-serif'; x.textAlign = 'center';
    m.data.forEach((pt, i) => { if (pts[i]) x.fillText('#' + pts[i], pt.x, pt.y + 30); }); x.restore(); }};
  const imgs = D.seasonsAll.map(se => { if (!by[se]) return 'circle'; const im = new Image(30, 30); im.src = 'logos/' + slug(by[se][1]) + '.webp'; im.onload = () => c.update('none'); return im; });
  const c = chart(el, {type: 'line', plugins: [labels], data: {labels: D.seasonsAll, datasets: [{label: 'Draft pick', data: pts, spanGaps: false, borderColor: '#64748b', borderWidth: 2, tension: .15,
      pointStyle: imgs, pointRadius: 15, pointHoverRadius: 17, pointBackgroundColor: D.seasonsAll.map(se => by[se] ? col(by[se][1]) : '#64748b'), pointBorderColor: '#0f1117', pointBorderWidth: 2}]},
    options: {maintainAspectRatio: false, layout: {padding: {bottom: 18, top: 10, left: 10, right: 20}},
      scales: {y: {reverse: true, min: 1, suggestedMax: Math.ceil((maxPick + 12) / 10) * 10, title: {display: true, text: 'Overall pick'}, ticks: {precision: 0}}, x: {title: {display: true, text: 'Season'}}},
      plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => { const x = by[D.seasonsAll[c.dataIndex]]; return x ? `${x[1]}: round ${x[2]}, pick #${x[3]}` : ''; }}}}}});
}
function shareLink(btn, pid) {
  const url = 'https://fantrax.whohashim.com/p/' + pid + '/', done = ok => { btn.textContent = ok ? 'Link copied!' : url; setTimeout(() => btn.textContent = 'Copy share link', 2500); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(() => done(true), () => done(false));
  else { const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} t.remove(); done(ok); }
}
function whoGo(name) { const k = Object.keys(D.players).find(k => pname(k).toLowerCase() === name.toLowerCase()); if (k) location.hash = 'whohas/' + k; }

/* ---------- router ---------- */
function render() {
  const [tab, x, y] = (location.hash.slice(1) || 'recap').split('/');
  const t = TABS.find(v => v[0] === tab) ? tab : 'recap';
  charts.splice(0).forEach(c => c.destroy());
  tid = 0;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.t === t));
  const v = {alltime: () => viewAlltime(), seasons: () => viewSeasons(x), owner: () => viewOwner(x), records: () => viewRecords(), rivalry: () => viewRivalry(x, y), recap: () => viewRecap(x, y), whohas: () => viewWho(x)}[t]();
  document.getElementById('panels').innerHTML = `<div class="tab-panel active">${v}</div>`;
  document.querySelectorAll('#panels table').forEach(t => { const w = document.createElement('div'); w.className = 'tscroll'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
  if (t === 'recap' && window._rs) { const u = '#recap/' + window._rs.join('/'); if (location.hash !== u) history.replaceState(null, '', u); }
  if (t === 'seasons') afterSeasons(x); if (t === 'whohas') afterWho(x); if (t === 'recap') afterRecap();
  window.scrollTo(0, 0);
}
document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab-btn" data-t="${k}" onclick="location.hash='${k}'">${l}</button>`).join('');
window.addEventListener('hashchange', render);
render();
</script>
<script src="/chat/chat.js" defer></script>
