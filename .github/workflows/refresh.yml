name: Refresh league data

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (7am PT / 10am ET), after the Sunday scoring period closes
    # Hourly at night PT: 00-07 UTC = 5pm-midnight PDT / 4pm-11pm PST. Off-peak minute :17 because GitHub delays or drops top-of-the-hour crons. No gate, so a delayed run still refreshes.
    - cron: "17 0-7 * * *"
    # Game log is only written in the 11pm PT hour (fetch_games.py); second run at :47 retries if the :17 run is dropped. 06 UTC = 11pm PDT, 07 UTC = 11pm PST.
    - cron: "47 6,7 * * *"
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tools for share cards (Chrome is preinstalled)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick fonts-liberation fonts-noto-color-emoji

      # Only the current season (leagues.json "current") is re-fetched. Older seasons are never rewritten.
      - name: Fetch current season
        run: |
          python -I scripts/fetch_history.py --current
          python -I scripts/fetch_players.py
          python -I scripts/fetch_rosters.py --current
          python -I scripts/fetch_player_stats.py
          python -I scripts/fetch_headshots.py
          python -I scripts/fetch_projections.py
          python -I scripts/fetch_bench.py
          python -I scripts/fetch_games.py

      # Fails (and emails you) if a team name can't be mapped to an owner or a finished season lost its scores.
      - name: Build dashboard and share cards
        run: |
          python -I scripts/build_dashboard.py
          python -I scripts/build_share.py

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh $(date -u +%Y-%m-%d\ %H:%M)Z"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
          git diff --quiet HEAD origin/main || { echo 'push failed'; exit 1; }
          # pushes made with GITHUB_TOKEN don't trigger the Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
